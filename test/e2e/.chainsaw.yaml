apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Configuration
metadata:
  name: custom-config
spec:
  namespace: kubedoop-operators
  timeouts:
    apply: 300s
    assert: 600s
    cleanup: 240s
    delete: 120s
    error: 180s
    exec: 300s
  # skipDelete: true
  failFast: true
  forceTerminationGracePeriod: 10s
  parallel: 1

apiVersion: zookeeper.kubedoop.dev/v1alpha1
kind: ZookeeperCluster
metadata:
  name: test-zk
spec:
  clusterConfig:
    listenerClass: cluster-internal
  servers:
    roleGroups:
      default:
        replicas: 1
        resources:
          cpu:
            min: "500m"
            max: "1000m"
          memory:
            limit: "2Gi"

---
apiVersion: zookeeper.kubedoop.dev/v1alpha1
kind: ZookeeperZnode
metadata:
  name: test-znode
spec:
  clusterRef:
    name: test-zk
---
# postgresql credentials
apiVersion: v1
kind: Secret
metadata:
  name: postgresql-credentials
type: Opaque
data:
  username: dGVzdA==
  password: dGVzdA==
---
apiVersion: dolphinscheduler.kubedoop.dev/v1alpha1
kind: DolphinschedulerCluster
metadata:
  name: test-dolphinscheduler
spec:
  image:
    productVersion: ($values.product_version)
  clusterConfig:
    zookeeperConfigMapName: test-znode
    database:
      databaseType: postgresql
      connectionString: jdbc:postgresql://postgresql:5432/dolphinscheduler
      credentialsSecret: postgresql-credentials
  master:
    roleConfig:
      podDisruptionBudget:
        maxUnavailable: 2
    roleGroups:
      default:
        replicas: 1
        config:
          resources:
            cpu:
              min: "500m"
              max: "1000m"
            memory:
              limit: "2Gi"
  worker:
    roleConfig:
      podDisruptionBudget:
        maxUnavailable: 2
    roleGroups:
      default:
        replicas: 1
  api:
    roleConfig:
      podDisruptionBudget:
        maxUnavailable: 2
    roleGroups:
      default:
        replicas: 1
  alerter:
    roleConfig:
      podDisruptionBudget:
        maxUnavailable: 2
    roleGroups:
      default:
        replicas: 1
